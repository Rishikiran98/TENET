[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenet"
version = "0.5.0"
description = "A scope-aware semantic memory layer for AI agents — the foundation for a governance gate and secure action agent."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Slice 1 (memory core) needs only numpy. Everything heavier is opt-in below,
# added when a measured need justifies it — not up front.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real semantic embeddings. Heavy (pulls in torch); only installed when you
# actually swap HashingEmbedder -> SentenceTransformerEmbedder.
embeddings = [
    "sentence-transformers>=2.5",
]
# Context projection on Postgres + pgvector (memory/pgvector.py). The server
# needs the `vector` extension; vectors are sent as text, so no client plugin.
postgres = [
    "psycopg[binary]>=3.1",
]
# Single-tenant HTTP surface (tenet.api).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# Test + tooling deps.
dev = [
    "pytest>=8",
    "httpx>=0.27",     # FastAPI TestClient; API tests skip without fastapi
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenet"]

[tool.pytest.ini_options]
# src layout: make `import tenet` resolve without an install step.
pythonpath = ["src"]
testpaths = ["tests"]
